# Requires a Nerd Font for the segment separators and module icons to render correctly

"$schema" = 'https://starship.rs/config-schema.json'

# Sets user-defined palette
# For a dark terminal: palette = 'slate_dark'
palette = 'slate_light'

format = """
[](primary)\
$os\
$username\
[](bg:secondary fg:primary)\
$directory\
[](bg:tertiary fg:secondary)\
$git_branch\
$git_status\
[](fg:tertiary bg:quaternary)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:quaternary bg:quinary)\
$conda\
[](fg:quinary bg:senary)\
$time\
[ ](fg:senary)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:primary fg:on_primary"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:primary fg:on_primary"
style_root = "bg:primary fg:on_primary"
format = '[ $user]($style)'

[directory]
style = "bg:secondary fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:tertiary"
format = '[[ $symbol $branch ](fg:base bg:tertiary)]($style)'

[git_status]
style = "bg:tertiary"
format = '[[($all_status$ahead_behind )](fg:base bg:tertiary)]($style)'

[nodejs]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[bun]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[c]
symbol = " "
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[rust]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[golang]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[php]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[java]
symbol = " "
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[kotlin]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[haskell]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[python]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:base bg:quaternary)]($style)'

[docker_context]
symbol = ""
style = "bg:quinary"
format = '[[ $symbol( $context) ](fg:base bg:quinary)]($style)'

[conda]
symbol = "  "
style = "fg:base bg:quinary"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:senary"
format = '[[  $time ](fg:base bg:senary)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:primary)'
vimcmd_replace_one_symbol = '[❮](bold fg:red)'
vimcmd_replace_symbol = '[❮](bold fg:red)'
vimcmd_visual_symbol = '[❮](bold fg:green)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:senary"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Palette definition
[palettes.slate_light]
on_primary = "#ffffff"
primary = "#3a3a34"    # charcoal
secondary = "#7c7b74"  # warm gray
tertiary = "#98978f"   # warm gray, lighter
quaternary = "#b3b2aa" # light warm gray
quinary = "#c9c8c1"    # light warm gray, lighter
senary = "#ddded9"     # greige, closest step to the white terminal background
base = "#1d1b1d"       # near-black, used as text on the gray segments
green = "#537b5a"      # success accent
red = "#a1676e"        # error accent

[palettes.slate_dark]
on_primary = "#1d1b1d"
primary = "#ddded9"      # greige accent, brightest chip
secondary = "#98978f"    # warm gray chip
tertiary = "#7c7b74"     # warm gray, darker
quaternary = "#565555"   # mid dark gray
quinary = "#3d3b3f"      # dark gray
senary = "#2d2a2e"       # closest step to the dark terminal background
base = "#ddddda"         # on-surface, used as text on the gray segments
green = "#6b9e78"        # success accent
red = "#ab787e"          # error accent
